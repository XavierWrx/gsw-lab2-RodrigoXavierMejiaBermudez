<VirtualHost *:8085>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Directory /var/www/dulcehogar.local>
        AllowOverride All
        Require all granted
    </Directory>

	ProxyPreserveHost On
	ProxyPass /api http://localhost:9090/api
	ProxyPassReverse /api http://localhost:9090/api

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar-access.log combined
</VirtualHost>
